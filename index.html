<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./js/main.js"></script>
    <link rel="stylesheet" href="./styles/style.css">
    <title>Clase 7 Js</title>
</head>
<body>

<header>
    <div class="contenedor">
        <div id="logo">
            <h1><img src="./assets/logo-nasa.webp" alt="logo de la nasa"> <span>Nasa</span></h1>
        </div>
        <div class="info">
            <h2>Centro de control de misiones</h2>
            <h3>simulador de viaje espacial</h3>
        </div>
    </div>
</header>

<main>
    <div class="contenedor">

        <div class="wrap">
            <section id="categorias">
                <h3>1. Selecciona una categoría</h3>
            </section>
            <section id="destinos">
                <h3>2. Destinos disponibles</h3>
                <div id="listaDestinos"></div>
            </section>
        </div>

        <aside>
            <section id="configuracion">
                <h3>3. Configura tu misión</h3>
            </section>
            <section id="resultados">
                <h3>4. Resultado de la simulación</h3>
            </section>
            <section id="misiones">
                <h3>5. Misiones lanzadas</h3>
            </section>
        </aside>
    </div>
</main>

    
</body>
</html>
